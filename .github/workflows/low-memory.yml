name: Low-memory

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: low-memory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Docker constrained-memory matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run constrained-memory matrix
        run: ./scripts/run-low-memory-matrix.sh

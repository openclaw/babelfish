name: CI

on:
  pull_request:
    paths-ignore: &contributor_metadata
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "AGENTS.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
  push:
    paths-ignore: *contributor_metadata
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: ${{ github.event_name == 'push' }}
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.23.4
          - os: xcode-27
            node: 22.23.4
          - os: windows-latest
            node: 22.23.4
          - os: ubuntu-latest
            node: 24.22.1
          - os: ubuntu-latest
            node: 26.12.1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: ${{ matrix.node }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Provide python3 command on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shim = Join-Path $env:RUNNER_TEMP "python3-shim"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          "@echo off`npython %*" | Set-Content -Path (Join-Path $shim "python3.cmd")
          $shim | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Pin npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify package contents
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Only source test files are excluded from the build and the tarball.
          # Manual runs and missing shallow-history bases get the full consumer check.
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
            git diff --quiet --no-ext-diff --ignore-submodules=none "$BASE_SHA" HEAD -- . ':(exclude,glob)src/*.test.ts'; then
            echo "Skipping package check: only source test files changed."
            exit 0
          fi
          # Keep the consumer install isolated while reusing setup-node's npm downloads.
          BABELFISH_CONSUMER_CACHE="$(npm config get cache | tr -d '\r')"
          export BABELFISH_CONSUMER_CACHE
          npm run pack:check

name: Bug report
description: Report a reproducible Babelfish defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose security vulnerabilities here. Use the private security advisory link instead.

  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: input
    attributes:
      label: Babelfish version or commit
      placeholder: 0.1.1 or a commit SHA
    validations:
      required: true

  - type: input
    attributes:
      label: OpenClaw version
      placeholder: Output of openclaw --version
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Source app
      options:
        - Claude Code
        - Codex
        - Hermes Agent
        - Multiple
        - Not app-specific
    validations:
      required: true

  - type: input
    attributes:
      label: Plugin source
      description: Public repository URL and commit, when applicable.

  - type: input
    attributes:
      label: Environment
      description: Operating system, Node version, and Python version when Hermes is involved.
      placeholder: macOS 15, Node 22.19.0, Python 3.13
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest sequence that reliably reproduces the problem.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs
      description: Remove credentials, private paths, hostnames, and other sensitive data.
      render: shell
